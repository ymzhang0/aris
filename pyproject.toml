[project]
name = "aris-core"
version = "0.1.0"
description = "ARIS core for agentic scientific research workflows."
readme = "README.md"
requires-python = ">=3.10, <3.13"
dependencies = [
    "pydantic>=2.0",
    "loguru>=0.7",
    "google-genai>=1.0",
    "python-dotenv>=1.2.1",
    "fastapi>=0.129.0",
    "uvicorn>=0.40.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.13.1",
    "pydantic-ai>=1.62.0",
    "ag-ui-protocol>=0.1.13,<0.2",
    "pycasbin>=2.6.1,<3",
    "ipykernel>=7.2.0",
    "sse-starlette>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aris_core", "src/aris_apps"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]
